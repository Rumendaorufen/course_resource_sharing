server:
  port: 8020
  servlet:
    context-path: /api
  ssl:
    enabled: false  

spring:
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  application:
    name: course-resource-sharing
  
  # MongoDB配置
  data:
    mongodb:
      uri: mongodb://localhost:27017/course_resource_sharing
      database: course_resource_sharing
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/course_resource_sharing?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: HikariCP
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: tue
    validate-on-migrate: false
    clean-disabled: false
    repair-on-migrate: true
    out-of-order: true

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m
    cache-names:
      - userDetails
      - resourceCache
      - courseCache
      - assignmentCache
      - submissionCache

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      FAIL_ON_EMPTY_BEANS: false
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
      location: ${user.dir}/temp

app:
  file-upload-dir: ./uploads
  jwt:
    secret: your-secret-key
    expiration: 86400000  # 24 hours in milliseconds
    refresh-expiration: 604800000  # 7 days in milliseconds

security:
  require-ssl: false  
  basic:
    enabled: false
  # 在Spring Boot 2.7.x中，security.ignored已弃用，主要通过SecurityConfig.java中的配置控制
  ignored: /auth/**, /swagger-ui/**, /v3/api-docs/**, /doc.html, /webjars/**, /knife4j/**, /favicon.ico, /favicon.svg

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-for-course-resource-sharing-platform}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-token-expiration: 604800000  
  header: Authorization
  token-prefix: Bearer 

file:
  upload:
    base-path: ${FILE_UPLOAD_PATH:./uploads}
    allowed-types: 
    max-size: 104857600  
  download:
    base-url: /files

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.course.entity

logging:
  level:
    root: INFO
    com.course: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 7

# Knife4j配置 - Knife4j 4.5.0官方推荐配置，适配context-path
knife4j:
  enable: true
  # 标题
  title: 课程资源共享平台 API文档
  # 作者
  author: 开发团队
  # 描述
  description: 提供课程资源共享平台的所有API接口说明
  # 版本
  version: 1.0.0
  setting:
    swaggerModelName:
      enabled: true
    # 4.5.0版本新增配置项
    language: zh_cn
    # 启用模型扫描
    enableSwaggerModelsScan: true
    # 启用调试模式
    enableDebug: true
  # 适配context-path的配置
  swagger:
    # 明确指定base-url，包含context-path
    base-url: /api
  # Knife4j UI页面的基础认证（可选）
  basic:
    enable: true
    username: admin
    password: admin
  
# SpringDoc配置 - 与Knife4j 4.5.0兼容配置，特别处理context-path
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    # 确保生成正确的JSON格式
    groups:
      enabled: true
    # 确保正确处理响应格式
    writer-with-default-pretty-printer: true
  swagger-ui:
    enabled: true
  # 明确配置服务器URL，确保正确处理context-path
  servers:
    - url: http://localhost:8020/api
      description: Local Development Server with context-path
  packages-to-scan: com.course.controller
  paths-to-match: /**
  show-actuator: false

cors:
  allowed-origins: "*"
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Authorization,Content-Type
  exposed-headers: Authorization
  allow-credentials: false
  max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true
    caches:
      enabled: true
